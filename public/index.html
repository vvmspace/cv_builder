<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Adapt // AI Generator</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-primary: #e6edf3;
            --accent-color: #00e5e5;
            --border-color: #30363d;
            --input-bg: #161b22;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            height: 300px;
            background-color: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            font-family: inherit;
            resize: vertical;
            font-size: 14px;
        }

        textarea:focus {
            outline: 1px solid var(--accent-color);
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        select {
            background-color: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: inherit;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #8b949e;
            min-height: 1.5rem;
        }

        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--text-primary);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>CV Adapt // VVM</h1>

    <div class="container">
        <textarea id="vacancyInput" placeholder="// PASTE JOB DESCRIPTION HERE..." style="height: 200px;"></textarea>
        <textarea id="customCommentInput" placeholder="// ENTER CUSTOM INSTRUCTIONS HERE (OPTIONAL)..."
            style="height: 100px;"></textarea>

        <div class="controls">
            <select id="templateSelect">
                <option value="dark">Dark Theme</option>
                <option value="light">Light Theme</option>
            </select>
            <select id="modelSelect">
                <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
                <option value="gemini-3-pro-preview">Gemini 3 Pro Preview</option>
                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
            </select>
            <button id="generateBtn" onclick="generateCV()">Generate PDF</button>
        </div>

        <div id="status"></div>
        <div style="margin-top: 1rem; display: flex; justify-content: center; width: 100%;">
            <a href="https://github.com/vvmspace/cv_builder" target="_blank"
                style="color: var(--accent-color); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; opacity: 0.8; transition: opacity 0.2s;"
                title="Welcome to contribute">
                <svg height="16" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="16"
                    data-view-component="true" style="fill: currentColor;">
                    <path
                        d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
                    </path>
                </svg>
                Welcome to contribute
            </a>
        </div>
    </div>

    <script>
        async function generateCV() {
            const vacancyText = document.getElementById('vacancyInput').value.trim();
            const customComment = document.getElementById('customCommentInput').value.trim();
            const model = document.getElementById('modelSelect').value;
            const template = document.getElementById('templateSelect').value;
            const btn = document.getElementById('generateBtn');
            const statusDiv = document.getElementById('status');

            if (!vacancyText) {
                alert("Please enter a job description.");
                return;
            }

            // UI Loading State
            btn.disabled = true;
            statusDiv.innerHTML = '<span class="loader"></span>Adapting CV... This may take up to 30 seconds.';

            try {
                const response = await fetch('/api/generate-cv', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        vacancy_text: vacancyText, 
                        custom_comment: customComment,
                        model: model, 
                        template: template 
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Unknown error occurred');
                }

                statusDiv.innerHTML = `Success! Downloading...`;

                // Trigger Download
                const link = document.createElement('a');
                link.href = data.pdf_url;
                link.download = ''; // Browser handles filename
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Check HTML logic if needed (optional)
                const htmlLink = document.createElement('a');
                htmlLink.href = data.html_url;
                htmlLink.target = '_blank';
                htmlLink.innerText = ' [Open HTML]';
                statusDiv.appendChild(htmlLink);

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = `<span style="color: #ff5555;">Error: ${error.message}</span>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
